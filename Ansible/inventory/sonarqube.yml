
---
- name: Install SonarQube on Ubuntu
  hosts: sonarqube
  become: true
  gather_facts: false

  tasks:

    - name: Update apt repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Configure SonarQube kernel parameter
      ansible.builtin.sysctl:
        name: vm.max_map_count
        value: "524288"
        state: present
        reload: true

    - name: Pull SonarQube image
      ansible.builtin.command:
        cmd: docker pull sonarqube:community
      changed_when: false

    - name: Check if SonarQube container exists
      ansible.builtin.command:
        cmd: docker ps -a --filter name=^sonarqube$ --format {% raw %}'{{.Names}}'{% endraw %}
      register: sonarqube_container
      changed_when: false

    - name: Start SonarQube container
      ansible.builtin.command:
        cmd: docker run -d --name sonarqube --restart unless-stopped -p 9000:9000 sonarqube:community
      when: sonarqube_container.stdout == ""
